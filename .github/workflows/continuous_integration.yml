name: continuous-integration

# syntax https://help.github.com/en/articles/workflow-syntax-for-github-actions
#
# Builds EMG-Assisted-COMAK in Release and runs the tests:
#  - every Monday at 8am (UTC), on the branch SCHEDULED_REF below (master_v2),
#  - on every push to master or master_v2 (and on tags),
#  - on every pull request,
#  - by hand: GitHub > Actions > continuous-integration > "Run workflow", where the branch to build can be chosen.
#
# GitHub only runs scheduled workflows from the DEFAULT branch of the repository. This file therefore has to be
# on the default branch for the Monday run to happen: either merge it into master, or set master_v2 as the
# default branch (GitHub > Settings > Branches > Default branch).
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        required: false
        default: 'master_v2'
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master
      - master_v2
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The branch that the scheduled (Monday) build checks out.
  SCHEDULED_REF: master_v2

jobs:
  windows2022:
    runs-on: windows-2022
    name: Windows

    steps:
    - uses: actions/checkout@v4
      with:
        # schedule: SCHEDULED_REF; manual run: the branch typed in "Run workflow"; push and pull request: as usual.
        ref: ${{ (github.event_name == 'schedule' && env.SCHEDULED_REF) || github.event.inputs.ref || '' }}

    - name: Install Doxygen
      # choco install doxygen.portable # <-- too unreliable.
      run: |
        (New-Object System.Net.WebClient).DownloadFile("https://github.com/doxygen/doxygen/releases/download/Release_1_12_0/doxygen-1.12.0.windows.x64.bin.zip", "doxygen.zip")
        7z x $env:GITHUB_WORKSPACE/doxygen.zip -odoxygen
        echo "$env:GITHUB_WORKSPACE\doxygen" >> $env:GITHUB_PATH

    - name: Install Python packages
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install numpy
      #Need numpy to use SWIG numpy typemaps.
      run: |
        python3 -m pip install numpy==2.0
        python3 -m pip install wheel
        python3 -m pip install build
        pip install --upgrade pip setuptools wheel
        pip install delvewheel

    - name: Install SWIG
      run: |
        choco install swig --version 4.4.1 --yes --limit-output --allow-downgrade
        swig -swiglib

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: build/dependencies/ci-msvc-windows-release/install
        # Every time a cache is created, it's stored with this key.
        # In subsequent runs, if the key matches the key of an existing cache,
        # then the cache is used. We chose for this key to depend on the
        # operating system and a hash of the hashes of all files in the
        # dependencies directory (non-recursive).
        # https://help.github.com/en/actions/automating-your-workflow-with-github-actions/caching-dependencies-to-speed-up-workflows#matching-a-cache-key
        key: ${{ runner.os }}-dependencies-${{ hashFiles('dependencies/*') }}

    - name: Build dependencies
      id: build-deps
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: |
        echo $env:GITHUB_WORKSPACE\\build_deps
        mkdir $env:GITHUB_WORKSPACE\\build_deps
        chdir $env:GITHUB_WORKSPACE\\build_deps
        # /W0 disables warnings.
        # https://msdn.microsoft.com/en-us/library/19z1t1wy.aspx
        # TODO: CMake provides /W3, which overrides our /W0
        cmake -E env CXXFLAGS="/W0" cmake $env:GITHUB_WORKSPACE/dependencies -LAH -G"Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX=~/opensim_dependencies_install -DSUPERBUILD_ezc3d=ON -DOPENSIM_WITH_CASADI=ON
        # The errors of this build are also written to build_errors.log (see the next step).
        cmake --build . --config Release -- /maxcpucount:4 /fl1 '/flp1:logfile=build_errors.log;errorsonly'

    - name: Show the errors of the dependency build
      if: failure() && steps.build-deps.conclusion == 'failure'
      run: |
        echo "=== errors of the MSBuild run (build_errors.log)"
        Get-Content $env:GITHUB_WORKSPACE\\build_deps\\build_errors.log -ErrorAction SilentlyContinue | Select-Object -First 80
        echo "=== newest non-empty log files of the external project steps"
        Get-ChildItem $env:GITHUB_WORKSPACE\\build_deps -Recurse -Filter *-err.log -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 0 } | Sort-Object LastWriteTime -Descending | Select-Object -First 6 | ForEach-Object { echo ("--- " + $_.FullName); Get-Content $_.FullName -Tail 40 }

    - name: Upload the dependency build logs
      if: failure() && steps.build-deps.conclusion == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: dependency-build-logs-win2022
        path: |
          build_deps/build_errors.log
          build_deps/**/*-err.log
          build_deps/**/*-out.log
        retention-days: 7

    - name: Configure EMG-Assisted-COMAK
      id: configure
      run: |
        mkdir $env:GITHUB_WORKSPACE\\build
        chdir $env:GITHUB_WORKSPACE\\build
        # TODO: Can remove /WX when we use that in CMakeLists.txt.
        # Set the CXXFLAGS environment variable to turn warnings into errors.
        # Skip timing test section included by default.
        cmake -E env CXXFLAGS="/WX -DSKIP_TIMING" cmake $env:GITHUB_WORKSPACE -LAH -G"Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX=~/EMG-Assisted-COMAK-install -DOPENSIM_DEPENDENCIES_DIR=~/opensim_dependencies_install -DOPENSIM_C3D_PARSER=ezc3d -DOPENSIM_WITH_CASADI=on -DBUILD_PYTHON_WRAPPING=on -DBUILD_JAVA_WRAPPING=on -DPython3_ROOT_DIR=C:\hostedtoolcache\windows\Python\3.10.11\x64
        $env:match = cmake -L . | Select-String -Pattern OPENSIM_QUALIFIED_VERSION
        $version = $env:match.split('=')[1]
        echo $version
        echo "VERSION=$version" >> $GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build EMG-Assisted-COMAK
      # Install now to avoid building bindings twice (TODO: issue when using Visual Studio 2019, is this an issue too in Visual Studio 2022?).
      run: |
        cmake --build --preset ci-msvc-windows-release -j 4
        cmake --build --preset ci-msvc-windows-release --target doxygen
        cmake --build --preset ci-msvc-windows-release --target install

    - name: Test EMG-Assisted-COMAK
      run: |
        ctest --preset ci-msvc-windows-release -j 4 -E Java_.*

    - name: Install EMG-Assisted-COMAK
      # TODO: This is where we wish to do the installing, but it's done above for now.
      run: |
        chdir $env:GITHUB_WORKSPACE\\build
        chdir $env:GITHUB_WORKSPACE
        Copy-Item -Path "~/EMG-Assisted-COMAK-install" -Destination "EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}" -Recurse
        7z a "EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}.zip" "EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}"

    - name: Build wheel
      run: |
        echo "PYTHONPATH= $env:USERPROFILE/EMG-Assisted-COMAK-install/bin">> $GITHUB_ENV
        # Move to the installed location of the python package.
        cd ~/EMG-Assisted-COMAK-install/sdk/python
        # Run python tests.
        python -m unittest discover --start-directory opensim/tests --verbose

    - name: Upload EMG-Assisted-COMAK
      uses: actions/upload-artifact@v4
      with:
        name: EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}-win2022
        path: EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}.zip
        # Keep the build for two weeks (the default is 90 days).
        retention-days: 14

  ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    # Not tried on Linux for this repository yet: a failure here does not make the whole run fail.
    # Remove this line when the Linux build passes.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'schedule' && env.SCHEDULED_REF) || github.event.inputs.ref || '' }}

    - name: Install Python packages
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Numpy
      run: |
        pip install pip --upgrade
        pip install numpy==1.25

    - name: Install packages
      run: sudo apt-get update && sudo apt-get install --yes build-essential libtool autoconf pkg-config gfortran libopenblas-dev liblapack-dev freeglut3-dev libxi-dev libxmu-dev doxygen patchelf

    - name: Install SWIG
      # if: steps.cache-swig.outputs.cache-hit != 'true'
      run: |
        mkdir ~/swig-source && cd ~/swig-source
        wget https://github.com/swig/swig/archive/refs/tags/v4.4.1.tar.gz
        tar xzf v4.4.1.tar.gz && cd swig-4.4.1
        sh autogen.sh && ./configure --prefix=$HOME/swig --disable-ccache
        make && make -j4 install

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: ~/opensim_dependencies_install
        key: ${{ runner.os }}-dependencies-${{ hashFiles('dependencies/*') }}

    - name: Build dependencies
      # if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: |
        mkdir $GITHUB_WORKSPACE/../build_deps
        cd $GITHUB_WORKSPACE/../build_deps
        DEP_CMAKE_ARGS=($GITHUB_WORKSPACE/dependencies -LAH)
        DEP_CMAKE_ARGS+=(-DCMAKE_INSTALL_PREFIX=~/opensim_dependencies_install)
        DEP_CMAKE_ARGS+=(-DCMAKE_BUILD_TYPE=Release)
        DEP_CMAKE_ARGS+=(-DSUPERBUILD_ezc3d=ON)
        DEP_CMAKE_ARGS+=(-DOPENSIM_WITH_CASADI=ON)
        printf '%s\n' "${DEP_CMAKE_ARGS[@]}"
        cmake "${DEP_CMAKE_ARGS[@]}"
        make --jobs 4

    - name: Configure EMG-Assisted-COMAK
      id: configure
      run: |
        mkdir $GITHUB_WORKSPACE/../build
        cd $GITHUB_WORKSPACE/../build
        OSIM_CMAKE_ARGS=($GITHUB_WORKSPACE -LAH)
        OSIM_CMAKE_ARGS+=(-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/../EMG-Assisted-COMAK-install)
        OSIM_CMAKE_ARGS+=(-DCMAKE_BUILD_TYPE=Release)
        OSIM_CMAKE_ARGS+=(-DOPENSIM_DEPENDENCIES_DIR=~/opensim_dependencies_install)
        OSIM_CMAKE_ARGS+=(-DOPENSIM_C3D_PARSER=ezc3d)
        OSIM_CMAKE_ARGS+=(-DBUILD_PYTHON_WRAPPING=on -DBUILD_JAVA_WRAPPING=on)
        OSIM_CMAKE_ARGS+=(-DSWIG_DIR=~/swig/share/swig)
        OSIM_CMAKE_ARGS+=(-DSWIG_EXECUTABLE=~/swig/bin/swig)
        OSIM_CMAKE_ARGS+=(-DOPENSIM_INSTALL_UNIX_FHS=OFF)
        OSIM_CMAKE_ARGS+=(-DOPENSIM_DOXYGEN_USE_MATHJAX=off)
        # TODO: Update to simbody.github.io/latest
        OSIM_CMAKE_ARGS+=(-DOPENSIM_SIMBODY_DOXYGEN_LOCATION="https://simbody.github.io/simtk.org/api_docs/simbody/latest/")
        OSIM_CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="-Werror")
        printf '%s\n' "${OSIM_CMAKE_ARGS[@]}"
        cmake "${OSIM_CMAKE_ARGS[@]}"
        VERSION=`cmake -L . | grep OPENSIM_QUALIFIED_VERSION | cut -d "=" -f2`
        echo $VERSION
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build EMG-Assisted-COMAK
      run: |
        cd $GITHUB_WORKSPACE/../build
        make --jobs 4

    - name: Test EMG-Assisted-COMAK
      run: |
        cd $GITHUB_WORKSPACE/../build
        # TODO: Temporary for python to find Simbody libraries.
        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/opensim_dependencies_install/simbody/lib
        ctest --parallel 4 --output-on-failure

    - name: Install EMG-Assisted-COMAK
      run: |
        cd $GITHUB_WORKSPACE/../build
        make doxygen
        make --jobs 4 install
        cd $GITHUB_WORKSPACE
        mv $GITHUB_WORKSPACE/../EMG-Assisted-COMAK-install EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}
        zip --symlinks --recurse-paths --quiet EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}-ubuntu24.zip EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}
        mv EMG-Assisted-COMAK-${{ steps.configure.outputs.version }} $GITHUB_WORKSPACE/../EMG-Assisted-COMAK-install

    - name: Test Python bindings
      run: |
        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/opensim_dependencies_install/simbody/lib
        cd $GITHUB_WORKSPACE/../EMG-Assisted-COMAK-install/sdk/Python
        # Run the python tests, verbosely.
        python3 -m unittest discover --start-directory opensim/tests --verbose

    - name: Upload EMG-Assisted-COMAK
      uses: actions/upload-artifact@v4
      with:
        # The upload-artifact zipping does not preserve symlinks or executable
        # bits. So we zip ourselves, even though this causes a double-zip.
        name: EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}-ubuntu24-linux
        path: EMG-Assisted-COMAK-${{ steps.configure.outputs.version }}-ubuntu24.zip
        retention-days: 14

  style:
    name: Style

    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'schedule' && env.SCHEDULED_REF) || github.event.inputs.ref || '' }}

    - name: Check for tabs
      # Ensure that there are no tabs in source code.
      # GREP returns 0 (true) if there are any matches, and
      # we don't want any matches. If there are matches,
      # print a helpful message, and make the test fail by using "false".
      # The GREP command here checks for any tab characters in the the files
      # that match the specified pattern. GREP does not pick up explicit tabs
      # (e.g., literally a \t in a source file).
      run: if grep --line-num --recursive --exclude-dir="*dependencies*" --exclude-dir="*snopt*" --include={CMakeLists.txt,*.cpp,*.c,*.h} -P "\t" . ; then echo "Tabs found in the lines shown above. See CONTRIBUTING.md about tabs."; false; fi
